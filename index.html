<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share your stay</title>
<style>
:root{--bg:#f3f6f4;--card:#ffffff;--ink:#16302b;--muted:#5b716b;--accent:#0f6b5c;--accent-ink:#ffffff;--line:#d5e0dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201d;--card:#183029;--ink:#e8f1ee;--muted:#9bb3ac;--accent:#4cc3ac;--accent-ink:#0a1f1a;--line:#2a4740}}
:root[data-theme="dark"]{--bg:#10201d;--card:#183029;--ink:#e8f1ee;--muted:#9bb3ac;--accent:#4cc3ac;--accent-ink:#0a1f1a;--line:#2a4740}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Georgia","Times New Roman",serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.98rem}
.list{display:grid;gap:10px;margin:0 0 22px}
button.line{all:unset;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1.02rem}
button.line:focus-visible,a.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.line small{display:block;margin-top:6px;color:var(--accent);font-family:system-ui,sans-serif;font-size:.82rem}
button.line.done{border-color:var(--accent)}
a.go{display:block;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-family:system-ui,sans-serif;font-weight:600;padding:15px;border-radius:12px;font-size:1.05rem}
.note{color:var(--muted);font-family:system-ui,sans-serif;font-size:.85rem;margin-top:14px;text-align:center}
</style>
</head>
<body>
<main>
<h1 id="title">Thanks for staying with us</h1>
<p class="sub">Not sure what to write? Tap a line to copy it, then paste it in your Google review. Feel free to change it to match your stay.</p>
<div class="list" id="list"></div>
<a class="go" id="go" href="#" target="_blank" rel="noopener">Write your review on Google</a>
<p class="note">Please share what you honestly experienced. Your words help future guests.</p>
</main>
<script>
// ====== EDIT THESE TWO LINES ======
var HOTEL_NAME = "Hotel The Soul of Thar";
var REVIEW_LINK = "https://share.google/CgaiceKIdJKgbkRnw";
// ==================================
var LINES = [
  "Clean, comfortable room and very friendly staff. We would happily stay again.",
  "Great location and a smooth check-in. The team was helpful throughout our stay.",
  "Breakfast was fresh and tasty, and the room was quiet and well kept.",
  "Good value for money. Staff went out of their way to make us feel welcome.",
  "Perfect for a family trip. Spacious room, spotless bathroom and kind service.",
  "Easy booking, polite staff and a peaceful stay. Recommended for business or leisure."
];
document.getElementById("title").textContent = "Thanks for staying at " + HOTEL_NAME;
document.title = HOTEL_NAME + " review";
document.getElementById("go").href = REVIEW_LINK;
var list = document.getElementById("list");
LINES.forEach(function(t){
  var b = document.createElement("button");
  b.className = "line";
  b.type = "button";
  var span = document.createElement("span");
  span.textContent = t;
  var s = document.createElement("small");
  s.textContent = "Tap to copy";
  b.appendChild(span); b.appendChild(s);
  b.onclick = function(){
    var done = function(){
      document.querySelectorAll("button.line").forEach(function(x){x.classList.remove("done");x.querySelector("small").textContent="Tap to copy";});
      b.classList.add("done"); s.textContent = "Copied. Now tap the button below.";
    };
    try{ navigator.clipboard.writeText(t).then(done, function(){ fallback(t); done(); }); }
    catch(e){ fallback(t); done(); }
  };
  list.appendChild(b);
});
function fallback(t){
  var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a);
  a.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(a);
}
</script>
</body>
</html>
